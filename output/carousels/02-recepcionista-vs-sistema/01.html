<!DOCTYPE html>
<html lang="es-MX"><head><meta charset="utf-8"><style>
:root{
  --eco-green:   #1DB86B;
  --forest-deep: #0F6E56;
  --deep-violet: #262033;
  --mist-white:  #F5F7F5;
  --red-alert:   #E53E3E;
  --gray-text:   #666666;
  --safe-margin: 80px;
}
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:'DM Sans',sans-serif;}
main{width:100%;height:100%;padding:var(--safe-margin);display:flex;flex-direction:column;justify-content:center;position:relative;}
.logo-mark{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;opacity:.95;}
.logo-mark svg{width:28px;height:28px;}
.logo-mark span{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;letter-spacing:1px;}
.logo-mark.on-dark span{color:#fff}
.logo-mark.on-light span{color:var(--deep-violet)}

.slide--portada{background:var(--deep-violet)}
.slide--portada .ilustracion{width:240px;margin:0 auto 48px;display:block;}
.slide--portada h1{font-family:'Syne',sans-serif;font-weight:800;font-size:72px;line-height:1.15;color:#fff;text-align:center;}

.slide--dato{background:var(--mist-white)}
.slide--dato .cifra{font-family:'Syne',sans-serif;font-weight:800;font-size:150px;line-height:1;color:var(--eco-green);text-align:center;}
.slide--dato .cifra--dolor{color:var(--red-alert)}
.slide--dato .contexto{font-size:34px;color:var(--gray-text);text-align:center;margin-top:32px;line-height:1.5;max-width:840px;margin-left:auto;margin-right:auto;}

.slide--narrativa{background:var(--mist-white)}
.slide--narrativa.dark{background:var(--deep-violet)}
.slide--narrativa p{font-size:44px;line-height:1.5;color:var(--deep-violet);max-width:900px;font-family:'DM Sans',sans-serif;font-weight:500;}
.slide--narrativa.dark p{color:#fff}

.slide--comparacion{background:var(--mist-white)}
.slide--comparacion h3{font-family:'Syne',sans-serif;font-weight:800;font-size:44px;color:var(--deep-violet);margin-bottom:40px;}
.slide--comparacion table{width:100%;border-collapse:collapse;font-size:30px;}
.slide--comparacion th{font-family:'Syne',sans-serif;font-weight:700;text-align:left;padding:24px 16px;background:var(--deep-violet);color:#fff;}
.slide--comparacion td{padding:24px 16px;border-bottom:1px solid #ddd;color:var(--deep-violet);}
.slide--comparacion tr.highlight td{border-left:6px solid var(--eco-green);background:#E8F7EF;}

.slide--checklist{background:var(--mist-white)}
.slide--checklist h3{font-family:'Syne',sans-serif;font-weight:800;font-size:44px;color:var(--deep-violet);margin-bottom:44px;}
.slide--checklist ul{list-style:none}
.slide--checklist li{display:flex;align-items:flex-start;gap:20px;font-size:34px;color:var(--deep-violet);margin-bottom:36px;}
.slide--checklist .check{flex:none;width:44px;height:44px;border-radius:50%;background:var(--eco-green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;}

.slide--cta{background:var(--deep-violet);text-align:center;}
.slide--cta h2{font-family:'Syne',sans-serif;font-weight:800;font-size:60px;color:#fff;line-height:1.25;}
</style></head>
<body class="slide--portada"><main>
<img class="ilustracion" style="filter:none" src="" alt=""><div class="ilustracion" style="width:220px;margin:0 auto 48px;"><svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
<g stroke="#1DB86B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<line x1="30" y1="120" x2="170" y2="120"/>
<line x1="40" y1="120" x2="40" y2="160"/>
<line x1="160" y1="120" x2="160" y2="160"/>
<rect x="70" y="95" width="45" height="25" rx="3"/>
<line x1="90" y1="120" x2="90" y2="130"/>
<path d="M78 130 h24 v6 h-24 z"/>
<path d="M100 60 q0 -18 18 -18 q18 0 18 18 l0 8 l-36 0 z"/>
<line x1="118" y1="68" x2="118" y2="95"/>
<line x1="105" y1="150" x2="105" y2="170"/><line x1="95" y1="170" x2="115" y2="170"/>
</g></svg></div><h1>¿Sabes cuánto te cuesta en verdad tu recepcionista?</h1>
<div class="logo-mark on-dark"><span style="color:#1DB86B"><svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
<g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
<circle cx="20" cy="6" r="3"/><circle cx="7" cy="16" r="3"/><circle cx="33" cy="16" r="3"/>
<circle cx="13" cy="32" r="3"/><circle cx="27" cy="32" r="3"/>
<line x1="20" y1="9" x2="7" y2="13"/><line x1="20" y1="9" x2="33" y2="13"/>
<line x1="7" y1="19" x2="13" y2="29"/><line x1="33" y1="19" x2="27" y2="29"/>
<line x1="13" y1="32" x2="27" y2="32"/>
</g></svg></span><span>ecoweb</span></div>
</main></body></html>
